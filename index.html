<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Gudang Mobile</title>
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS untuk tampilan modern & tombol besar -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Scan Barcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Library Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

  <h1 class="text-xl font-bold text-center text-blue-600 mb-4">Gudang Mobile</h1>

  <!-- Menu Pilihan (Tab Navigation) -->
  <div class="flex justify-around bg-white p-2 rounded-lg shadow mb-4 text-sm font-semibold">
    <button onclick="switchTab('scan')" class="text-blue-600 border-b-2 border-blue-600 py-1">1. Scan Barang</button>
    <button onclick="switchTab('opname')" class="text-gray-500 py-1">2. Stock Opname</button>
    <button onclick="switchTab('jadwal')" class="text-gray-500 py-1">3. Jadwal Datang</button>
  </div>

  <!-- MODUL 1: SCAN BARCODE (MASUK / KELUAR) -->
  <div id="tab-scan" class="bg-white p-4 rounded-lg shadow">
    <h2 class="font-bold text-gray-700 mb-2">Scan Barcode (Masuk / Keluar)</h2>
    <div id="reader" class="w-full bg-gray-200 rounded mb-4"></div>
    
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-500">Kode Barcode:</label>
        <input id="barcode-result" type="text" readonly class="w-full p-2 border rounded bg-gray-50 font-mono text-sm">
      </div>
      <div>
        <label class="text-xs text-gray-500">Jumlah (Qty):</label>
        <input id="qty-input" type="number" value="1" min="1" class="w-full p-2 border rounded text-sm">
      </div>
      <div class="flex gap-2">
        <button onclick="prosesStok('masuk')" class="w-1/2 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Barang MASUK</button>
        <button onclick="prosesStok('keluar')" class="w-1/2 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700">Barang KELUAR</button>
      </div>
    </div>
  </div>

  <!-- MODUL 2: STOCK OPNAME -->
  <div id="tab-opname" class="bg-white p-4 rounded-lg shadow hidden">
    <h2 class="font-bold text-gray-700 mb-2">Stock Opname (Cocokkan Fisik)</h2>
    <p class="text-xs text-gray-500 mb-3">Scan barang di rak, lalu isi jumlah fisik barang yang dihitung.</p>
    <div class="space-y-3">
      <input id="opname-barcode" type="text" placeholder="Hasil Scan Barcode" readonly class="w-full p-2 border rounded bg-gray-50 text-sm">
      <input id="opname-fisik" type="number" placeholder="Masukkan Stok Fisik" class="w-full p-2 border rounded text-sm">
      <button onclick="simpanOpname()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Simpan Hasil Opname</button>
    </div>
  </div>

  <!-- MODUL 3: JADWAL BARANG DATANG -->
  <div id="tab-jadwal" class="bg-white p-4 rounded-lg shadow hidden">
    <h2 class="font-bold text-gray-700 mb-2">Jadwal Barang Datang</h2>
    <div class="space-y-2 mb-4">
      <input id="jadwal-tanggal" type="date" class="w-full p-2 border rounded text-sm">
      <input id="jadwal-supplier" type="text" placeholder="Nama Supplier" class="w-full p-2 border rounded text-sm">
      <input id="jadwal-barang" type="text" placeholder="Nama Barang" class="w-full p-2 border rounded text-sm">
      <input id="jadwal-qty" type="number" placeholder="Jumlah Rencana" class="w-full p-2 border rounded text-sm">
      <button onclick="tambahJadwal()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Catat Jadwal Datang</button>
    </div>
    
    <h3 class="font-bold text-xs text-gray-500 mb-2">Daftar Jadwal Kedatangan:</h3>
    <div id="list-jadwal" class="space-y-2 text-sm"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
